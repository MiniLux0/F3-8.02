name: Deploy → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite correr manualmente desde la UI

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build con Vite
        # VITE_BASE debe coincidir con el nombre de tu repo en GitHub
        # Ejemplo: si tu repo es github.com/MiniLux0/F3-8.02 → /F3-8.02/
        env:
          VITE_BASE: /F3-8.02/
        run: npm run build

      # Los PDFs son assets estáticos que Vite no procesa.
      # Los copiamos manualmente al dist/ para que GitHub Pages los sirva.
      - name: Copiar carpetas de PDFs al build
        run: |
          cp -r CF2B1_Fisica_III_UNI dist/
          cp -r 8.02-spring-2007 dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
